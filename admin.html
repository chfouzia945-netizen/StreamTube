<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — StreamTube</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="/">Stream<span>Tube</span></a><nav><a href="/">Home</a><a href="studio.html">Studio</a></nav></header><main class="studio"><h1>Admin control center</h1><p class="muted">Users, videos, views, revenue and withdrawal requests.</p><div id="stats" class="stats"></div><div class="card"><h2>Withdrawal requests</h2><div id="withdrawals"></div></div><section class="card" style="margin-top:20px"><h2>Ad campaigns</h2><form onsubmit="createAd(event)" style="display:grid;gap:8px"><input id="adTitle" placeholder="Campaign title" required><input id="creativeUrl" placeholder="Creative image/video URL" required><input id="targetUrl" placeholder="Target URL" required><input id="budget" type="number" min="1" step="0.01" placeholder="Budget USD" required><input id="creatorCpm" type="number" min="0" step="0.01" placeholder="Creator CPM" required><input id="platformCpm" type="number" min="0.01" step="0.01" placeholder="Platform CPM" required><button>Create campaign</button></form><div id="ads" style="margin-top:12px"></div></section></main><script>
async function load(){let h={Authorization:"Bearer "+localStorage.token};let r=await fetch("/api/admin/stats",{headers:h});if(!r.ok)return document.body.innerHTML='<main class="auth"><div class="auth-card"><h2>Admin login required</h2><a class="btn wide" href="login.html">Login</a></div><section class="card" style="margin-top:20px"><h2>Ad campaigns</h2><form onsubmit="createAd(event)" style="display:grid;gap:8px"><input id="adTitle" placeholder="Campaign title" required><input id="creativeUrl" placeholder="Creative image/video URL" required><input id="targetUrl" placeholder="Target URL" required><input id="budget" type="number" min="1" step="0.01" placeholder="Budget USD" required><input id="creatorCpm" type="number" min="0" step="0.01" placeholder="Creator CPM" required><input id="platformCpm" type="number" min="0.01" step="0.01" placeholder="Platform CPM" required><button>Create campaign</button></form><div id="ads" style="margin-top:12px"></div></section></main>';let s=await r.json();stats.innerHTML=[["Users",s.users],["Videos",s.videos],["Views",s.views],["Comments",s.comments],["Pending withdrawals",s.withdrawals],["Ledger revenue","$"+s.adRevenue.toFixed(2)]].map(a=>'<div class="stat"><small>'+a[0]+'</small><b>'+a[1]+'</b></div>').join("");let w=await (await fetch("/api/admin/withdrawals",{headers:h})).json();withdrawals.innerHTML=w.map(x=>'<div class="row"><span><b>'+x.user+'</b> — $'+x.amount+' — '+x.status+'</span>'+(x.status==="pending"?'<span><button onclick="act(\\''+x.id+'\\',\\'paid\\')">Mark paid</button> <button onclick="act(\\''+x.id+'\\',\\'rejected\\')">Reject</button></span>':'')+'</div>').join("")||'<p class="muted">No requests.</p>'}
async function act(id,status){await fetch("/api/admin/withdrawals/"+id,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+localStorage.token},body:JSON.stringify({status})});load()}load();
</script></body></html>
<script>
async function loadAds(){const h={Authorization:"Bearer "+localStorage.token};const r=await fetch("/api/admin/ads",{headers:h});if(!r.ok)return;const a=await r.json();ads.innerHTML=a.map(x=>`<div class="row"><span><b>${x.title}</b> — $${Number(x.remainingBudget).toFixed(2)} left — ${x.impressions} impressions</span><button onclick="toggleAd('${x.id}','${x.status==='active'?'paused':'active'}')">${x.status==='active'?'Pause':'Activate'}</button></div>`).join("")||'<p class="muted">No campaigns.</p>'}
async function createAd(e){e.preventDefault();const h={"Content-Type":"application/json",Authorization:"Bearer "+localStorage.token};const body={title:adTitle.value,creativeUrl:creativeUrl.value,targetUrl:targetUrl.value,budget:budget.value,creatorCpm:creatorCpm.value,platformCpm:platformCpm.value};const r=await fetch('/api/admin/ads',{method:'POST',headers:h,body:JSON.stringify(body)});const x=await r.json();if(!r.ok)return alert(x.error);e.target.reset();loadAds()}
async function toggleAd(id,status){await fetch('/api/admin/ads/'+id+'/status',{method:'POST',headers:{"Content-Type":"application/json",Authorization:"Bearer "+localStorage.token},body:JSON.stringify({status})});loadAds()}
loadAds();
</script>
