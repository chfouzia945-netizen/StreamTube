<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upload — StreamTube</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="/">Stream<span>Tube</span></a><nav><a href="/">Home</a><a href="studio.html">Studio</a></nav></header><main class="form-page"><div class="card"><h1>Upload video</h1><p class="muted">Publish a video to your channel.</p><input id="title" placeholder="Video title"><textarea id="description" placeholder="Description"></textarea><select id="category"><option>Entertainment</option><option>Music</option><option>Gaming</option><option>Education</option><option>Travel</option><option>News</option><option>Sports</option></select><label>Video file<input id="video" type="file" accept="video/*"></label><label>Thumbnail<input id="thumbnail" type="file" accept="image/*"></label><button class="btn" onclick="upload()">Publish video</button><div id="msg"></div></div></main><script>
async function upload(){if(!localStorage.token)return location="login.html";let fd=new FormData();fd.append("title",title.value);fd.append("description",description.value);fd.append("category",category.value);fd.append("video",video.files[0]);if(thumbnail.files[0])fd.append("thumbnail",thumbnail.files[0]);msg.textContent="Uploading...";let r=await fetch("/api/upload",{method:"POST",headers:{Authorization:"Bearer "+localStorage.token},body:fd});let x=await r.json();if(!r.ok)return msg.textContent=x.error;msg.innerHTML='<a href="watch.html?id='+x.id+'">Upload complete — processing started. Open video</a>'}
</script></body></html>
