<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account — StreamTube</title><link rel="stylesheet" href="style.css"></head><body><main class="auth"><a class="logo" href="/">Stream<span>Tube</span></a><div class="auth-card"><h1 id="mode">Login</h1><p class="muted">Create an account or sign in to your channel.</p><input id="username" placeholder="Username" style="display:none"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button class="btn wide" onclick="submitAuth()">Continue</button><p id="msg"></p><button class="linkbtn" onclick="toggle()">Create a new account</button><div class="demo"><b>Demo admin:</b> admin@streamtube.local / Admin123!</div></div></main><script>
let signup=false;function toggle(){signup=!signup;mode.textContent=signup?"Create account":"Login";username.style.display=signup?"block":"none";document.querySelector(".linkbtn").textContent=signup?"I already have an account":"Create a new account"}
async function submitAuth(){let r=await fetch("/api/"+(signup?"register":"login"),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:username.value,email:email.value,password:password.value})});let x=await r.json();if(!r.ok)return msg.textContent=x.error;localStorage.token=x.token;location="studio.html"}
</script></body></html>
