<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio — StreamTube</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="/">Stream<span>Tube</span></a><nav><a href="/">Home</a><a href="upload.html">＋ Upload</a><button onclick="logout()">Logout</button></nav></header><main class="studio"><div class="studio-top"><div><span class="pill">CREATOR STUDIO</span><h1>Channel dashboard</h1><p class="muted">Manage videos, performance and monetization.</p></div><a class="btn" href="upload.html">Upload video</a></div><div id="stats" class="stats"></div><div class="card"><h2>Your videos</h2><div id="videos"></div></div><div class="card"><h2>Creator earnings</h2><p class="muted">Demo monetization ledger. Real ad-network revenue must be connected before real payouts.</p><div class="earn"><b id="earn">$0.00</b><button class="btn" onclick="withdraw()">Request withdrawal</button></div></div></main><script>
async function load(){if(!localStorage.token)return location="login.html";let r=await fetch("/api/studio",{headers:{Authorization:"Bearer "+localStorage.token}});if(r.status===401)return location="login.html";let x=await r.json();stats.innerHTML=[["Views",x.views],["Subscribers",x.subscribers],["Likes",x.likes],["Videos",x.videos.length]].map(a=>'<div class="stat"><small>'+a[0]+'</small><b>'+a[1].toLocaleString()+'</b></div>').join("");earn.textContent="$"+Number(x.earnings).toFixed(2);videos.innerHTML=x.videos.map(v=>'<div class="row"><b>'+v.title+'</b><span>'+v.views.toLocaleString()+' views</span><a href="watch.html?id='+v.id+'">Watch</a></div>').join("")||'<p class="muted">No videos yet.</p>'}
async function withdraw(){let amount=prompt("Amount to withdraw (minimum $10 in this demo):");if(!amount)return;let r=await fetch("/api/withdraw",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+localStorage.token},body:JSON.stringify({amount})});let x=await r.json();alert(x.message||x.error)}
function logout(){localStorage.removeItem("token");location="/"} load();
</script></body></html>
